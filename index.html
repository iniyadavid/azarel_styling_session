<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azarel — We'll be back soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Italianno&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e6e1;--card:#f4f2ee;--ink:#1c1917;--mute:#6f6862;--line:#d6d1ca}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;padding:24px 16px}
.card{max-width:520px;width:100%;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:44px 28px}
.brand{font:400 clamp(48px,12vw,68px)/1 Italianno,cursive;margin:0 0 12px}
h1{font:500 clamp(24px,5.5vw,32px)/1.2 "Playfair Display",Georgia,serif;margin:0 0 12px}
p{color:var(--mute);margin:0}
.rule{width:48px;height:1px;background:var(--line);margin:22px auto}
</style>
</head>
<body>
<main class="card">
  <div class="brand">Azarel</div>
  <h1>We'll be back soon</h1>
  <p>Our site is under construction. We're working on something new — please check back shortly.</p>
  <div class="rule"></div>
  <p style="font-size:14px">Thank you for your patience.</p>
</main>
</body>
</html>
